```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Master Ultimate 🧠</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    padding: 20px;
}

.game-container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    text-align: center;
}

h1 {
    font-size: 3rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.subtitle {
    color: #b8b8d1;
    margin-bottom: 20px;
}

.level-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.level-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 12px;
    min-width: 120px;
}

.level-box span {
    display: block;
    font-size: 1.3rem;
    font-weight: bold;
    color: #ffd700;
}

.progress-container {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-bar {
    height: 100%;
    width: 5%;
    background: linear-gradient(90deg, #00f7ff, #ff00cc);
    transition: width 0.5s;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

.stat-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 12px 20px;
    border-radius: 12px;
    min-width: 120px;
}

.stat-box span {
    display: block;
    font-size: 1.4rem;
    font-weight: bold;
    color: #00f7ff;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 650px;
    margin: auto;
}

.card {
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: pointer;
    perspective: 1000px;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    font-size: 2.4rem;
}

.card-front {
    background: linear-gradient(135deg, #ff00cc, #333399);
    border: 2px solid rgba(255,255,255,0.3);
}

.card-back {
    background: white;
    color: #222;
    transform: rotateY(180deg);
}

.card.matched .card-back {
    background: #00ff9d;
    animation: matched 0.5s ease;
}

@keyframes matched {
    50% {
        transform: rotateY(180deg) scale(1.12);
    }
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 24px;
}

button {
    padding: 13px 24px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #00f7ff, #ff00cc);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
}

.win-message {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 18px;
    background: rgba(0, 255, 157, 0.15);
    border: 1px solid #00ff9d;
}

.win-message h2 {
    color: #00ff9d;
    margin-bottom: 10px;
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    pointer-events: none;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 2rem;
    }

    .game-board {
        gap: 8px;
    }

    .card-front,
    .card-back {
        font-size: 1.6rem;
    }

    .stat-box {
        min-width: 95px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🧠 MEMORY MASTER</h1>
    <p class="subtitle">20 Levels • Flip • Remember • Match • Become the Ultimate Master 👑</p>

    <div class="level-area">

        <div class="level-box">
            LEVEL
            <span id="level">1</span>
        </div>

        <div class="level-box">
            DIFFICULTY
            <span id="difficulty">Easy</span>
        </div>

        <div class="level-box">
            HIGH SCORE
            <span id="highScore">0</span>
        </div>

    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="stats">

        <div class="stat-box">
            Moves
            <span id="moves">0</span>
        </div>

        <div class="stat-box">
            Time
            <span id="timer">00:00</span>
        </div>

        <div class="stat-box">
            Score
            <span id="score">0</span>
        </div>

        <div class="stat-box">
            Matches
            <span id="matches">0 / 0</span>
        </div>

    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="buttons">

        <button onclick="startGame()">
            🔄 Restart Level
        </button>

        <button onclick="resetProgress()">
            🗑 Reset Progress
        </button>

    </div>

    <div class="win-message" id="winMessage">
        <h2 id="winTitle">🎉 LEVEL COMPLETE!</h2>
        <p id="winStats"></p>

        <div class="buttons">
            <button id="nextButton" onclick="nextLevel()">
                ➡️ Next Level
            </button>
        </div>
    </div>

</div>

<script>

const allEmojis = [
    "🎮","🤖","🚀","💻","🔥","⚡","🎯","🧠",
    "👾","🎵","🌟","🍕","🐱","🦁","🐼","🌈",
    "🏆","👑","🎲","🎸","🚗","🛸","🦄","🍩"
];

let level = Number(localStorage.getItem("memoryLevel")) || 1;
let highScore = Number(localStorage.getItem("memoryHighScore")) || 0;

let cards = [];
let flippedCards = [];
let moves = 0;
let matches = 0;
let seconds = 0;
let timer;
let gameStarted = false;
let lockBoard = false;
let currentPairs = 4;


function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}


function getDifficulty() {

    if (level <= 5) {
        return "🟢 Easy";
    }

    if (level <= 10) {
        return "🟡 Medium";
    }

    if (level <= 15) {
        return "🟠 Hard";
    }

    return "🔴 Master";
}


function getPairs() {

    /*
    Level progression:
    1-5   = 4 pairs
    6-10  = 6 pairs
    11-15 = 8 pairs
    16-20 = 10 pairs
    */

    if (level <= 5) return 4;
    if (level <= 10) return 6;
    if (level <= 15) return 8;
    return 10;
}


function updateLevelUI() {

    document.getElementById("level").textContent = level;
    document.getElementById("difficulty").textContent = getDifficulty();
    document.getElementById("highScore").textContent = highScore;

    const progress = (level / 20) * 100;

    document.getElementById("progressBar").style.width =
        `${Math.max(5, progress)}%`;
}


function startGame() {

    clearInterval(timer);

    currentPairs = getPairs();

    const selectedEmojis =
        shuffle(allEmojis).slice(0, currentPairs);

    cards =
        shuffle([...selectedEmojis, ...selectedEmojis]);

    flippedCards = [];
    moves = 0;
    matches = 0;
    seconds = 0;
    gameStarted = false;
    lockBoard = false;

    updateLevelUI();

    document.getElementById("moves").textContent = "0";
    document.getElementById("timer").textContent = "00:00";
    document.getElementById("score").textContent = "0";

    document.getElementById("matches").textContent =
        `0 / ${currentPairs}`;

    document.getElementById("winMessage").style.display = "none";

    const board =
        document.getElementById("gameBoard");

    board.innerHTML = "";

    board.style.gridTemplateColumns =
        currentPairs <= 6
        ? "repeat(4, 1fr)"
        : "repeat(4, 1fr)";


    cards.forEach((emoji) => {

        const card =
            document.createElement("div");

        card.classList.add("card");

        card.dataset.emoji = emoji;

        card.innerHTML = `

            <div class="card-inner">

                <div class="card-front">
                    ❓
                </div>

                <div class="card-back">
                    ${emoji}
                </div>

            </div>

        `;

        card.addEventListener("click", flipCard);

        board.appendChild(card);

    });

}


function flipCard() {

    if (
        lockBoard ||
        this.classList.contains("flipped") ||
        this.classList.contains("matched")
    ) {
        return;
    }


    if (!gameStarted) {

        gameStarted = true;

        timer = setInterval(() => {

            seconds++;

            updateTimer();

        }, 1000);

    }


    this.classList.add("flipped");

    flippedCards.push(this);


    if (flippedCards.length === 2) {

        moves++;

        document.getElementById("moves").textContent =
            moves;

        checkMatch();

    }

}


function updateTimer() {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    document.getElementById("timer").textContent =
        `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

}


function checkMatch() {

    lockBoard = true;

    const [card1, card2] =
        flippedCards;


    if (
        card1.dataset.emoji ===
        card2.dataset.emoji
    ) {

        card1.classList.remove("flipped");
        card2.classList.remove("flipped");

        card1.classList.add("matched");
        card2.classList.add("matched");

        matches++;

        document.getElementById("matches").textContent =
            `${matches} / ${currentPairs}`;

        flippedCards = [];

        lockBoard = false;


        if (matches === currentPairs) {

            levelComplete();

        }

    }

    else {

        setTimeout(() => {

            card1.classList.remove("flipped");
            card2.classList.remove("flipped");

            flippedCards = [];

            lockBoard = false;

        }, 750);

    }

}


function calculateScore() {

    /*
    Higher level = more base points.
    Fewer moves and less time = higher score.
    */

    const baseScore =
        level * 1000;

    const movePenalty =
        moves * 25;

    const timePenalty =
        seconds * 2;

    const finalScore =
        Math.max(
            100,
            baseScore -
            movePenalty -
            timePenalty
        );

    return finalScore;

}


function levelComplete() {

    clearInterval(timer);

    const score =
        calculateScore();

    document.getElementById("score").textContent =
        score;


    if (score > highScore) {

        highScore = score;

        localStorage.setItem(
            "memoryHighScore",
            highScore
        );

        document.getElementById("highScore").textContent =
            highScore;

    }


    const winMessage =
        document.getElementById("winMessage");

    const winTitle =
        document.getElementById("winTitle");

    const winStats =
        document.getElementById("winStats");


    if (level === 20) {

        winTitle.textContent =
            "👑 ULTIMATE MEMORY MASTER! 👑";

        winStats.innerHTML =
            `🎉 You conquered all 20 levels!<br><br>
             🏆 Final Score: <b>${score}</b><br>
             🎯 Moves: <b>${moves}</b><br>
             ⏱️ Time: <b>${document.getElementById("timer").textContent}</b><br><br>
             You are the TRUE MEMORY MASTER! 🧠🔥`;

        document.getElementById("nextButton").style.display =
            "none";

    }

    else {

        winTitle.textContent =
            "🎉 LEVEL COMPLETE!";

        winStats.innerHTML =
            `🏆 Score: <b>${score}</b><br>
             🎯 Moves: <b>${moves}</b><br>
             ⏱️ Time: <b>${document.getElementById("timer").textContent}</b><br><br>
             Level ${level + 1} is ready! 🚀`;

        document.getElementById("nextButton").style.display =
            "inline-block";

    }


    winMessage.style.display =
        "block";

    createConfetti();

}


function nextLevel() {

    if (level < 20) {

        level++;

        localStorage.setItem(
            "memoryLevel",
            level
        );

        startGame();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


function resetProgress() {

    const confirmed =
        confirm(
            "Reset all 20-level progress and high score?"
        );

    if (!confirmed) return;


    level = 1;

    highScore = 0;

    localStorage.removeItem(
        "memoryLevel"
    );

    localStorage.removeItem(
        "memoryHighScore"
    );

    startGame();

}


function createConfetti() {

    const symbols = [
        "🎉","✨","⭐","🎊","🏆",
        "🔥","💥"
    ];


    for (let i = 0; i < 60; i++) {

        const confetti =
            document.createElement("div");

        confetti.classList.add(
            "confetti"
        );

        confetti.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.fontSize =
            Math.random() * 20 + 15 + "px";

        confetti.style.animationDuration =
            Math.random() * 2 + 2 + "s";


        document.body.appendChild(
            confetti
        );


        setTimeout(() => {

            confetti.remove();

        }, 4000);

    }

}


updateLevelUI();

startGame();

</script>

</body>
</html>
