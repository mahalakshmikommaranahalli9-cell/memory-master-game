```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Master 🧠</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #0f0c29;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game-container {
    width: 100%;
    max-width: 700px;
    text-align: center;
}

h1 {
    font-size: 3rem;
    margin-bottom: 8px;
    letter-spacing: 2px;
}

.subtitle {
    color: #b8b8d1;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.stat-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 12px 20px;
    border-radius: 12px;
    min-width: 120px;
    backdrop-filter: blur(10px);
}

.stat-box span {
    display: block;
    font-size: 1.5rem;
    font-weight: bold;
    color: #00f7ff;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.card {
    aspect-ratio: 1 / 1;
    position: relative;
    cursor: pointer;
    perspective: 1000px;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    backface-visibility: hidden;
    font-size: 2.5rem;
}

.card-front {
    background: linear-gradient(135deg, #ff00cc, #333399);
    border: 2px solid rgba(255,255,255,0.3);
}

.card-back {
    background: white;
    transform: rotateY(180deg);
    color: #222;
}

.card:hover .card-front {
    transform: scale(1.03);
}

.card.matched .card-back {
    background: #00ff9d;
    animation: matched 0.5s ease;
}

@keyframes matched {
    0% {
        transform: rotateY(180deg) scale(1);
    }
    50% {
        transform: rotateY(180deg) scale(1.15);
    }
    100% {
        transform: rotateY(180deg) scale(1);
    }
}

.restart-btn {
    margin-top: 25px;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #00f7ff, #ff00cc);
    color: white;
    transition: 0.3s;
}

.restart-btn:hover {
    transform: scale(1.08);
}

.win-message {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(0, 255, 157, 0.15);
    border: 1px solid #00ff9d;
}

.win-message h2 {
    color: #00ff9d;
    margin-bottom: 8px;
}

@media (max-width: 500px) {

    h1 {
        font-size: 2.2rem;
    }

    .game-board {
        gap: 9px;
    }

    .card-front,
    .card-back {
        font-size: 1.8rem;
    }

}
</style>
</head>

<body>

<div class="game-container">

    <h1>🧠 MEMORY MASTER</h1>
    <p class="subtitle">Flip • Remember • Match • Win 🎮</p>

    <div class="stats">

        <div class="stat-box">
            Moves
            <span id="moves">0</span>
        </div>

        <div class="stat-box">
            Time
            <span id="timer">00:00</span>
        </div>

        <div class="stat-box">
            Matches
            <span id="matches">0 / 8</span>
        </div>

    </div>

    <div class="game-board" id="gameBoard"></div>

    <button class="restart-btn" onclick="startGame()">
        🔄 Restart Game
    </button>

    <div class="win-message" id="winMessage">
        <h2>🎉 YOU WON!</h2>
        <p id="winStats"></p>
    </div>

</div>


<script>

const emojis = [
    "🎮", "🤖", "🚀", "💻",
    "🔥", "⚡", "🎯", "🧠"
];

let cards = [];
let flippedCards = [];
let moves = 0;
let matches = 0;
let seconds = 0;
let timer;
let gameStarted = false;
let lockBoard = false;


function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}


function startGame() {

    clearInterval(timer);

    cards = shuffle([...emojis, ...emojis]);

    flippedCards = [];
    moves = 0;
    matches = 0;
    seconds = 0;
    gameStarted = false;
    lockBoard = false;

    document.getElementById("moves").textContent = moves;
    document.getElementById("matches").textContent = "0 / 8";
    document.getElementById("timer").textContent = "00:00";

    document.getElementById("winMessage").style.display = "none";

    const board = document.getElementById("gameBoard");

    board.innerHTML = "";

    cards.forEach((emoji, index) => {

        const card = document.createElement("div");

        card.classList.add("card");

        card.dataset.emoji = emoji;
        card.dataset.index = index;

        card.innerHTML = `
            <div class="card-inner">

                <div class="card-front">
                    ❓
                </div>

                <div class="card-back">
                    ${emoji}
                </div>

            </div>
        `;

        card.addEventListener("click", flipCard);

        board.appendChild(card);

    });

}


function flipCard() {

    if (
        lockBoard ||
        this.classList.contains("flipped") ||
        this.classList.contains("matched")
    ) {
        return;
    }


    if (!gameStarted) {

        gameStarted = true;

        timer = setInterval(() => {

            seconds++;

            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;

            document.getElementById("timer").textContent =
                `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

        }, 1000);

    }


    this.classList.add("flipped");

    flippedCards.push(this);


    if (flippedCards.length === 2) {

        moves++;

        document.getElementById("moves").textContent = moves;

        checkMatch();

    }

}


function checkMatch() {

    lockBoard = true;

    const [card1, card2] = flippedCards;

    if (card1.dataset.emoji === card2.dataset.emoji) {

        card1.classList.remove("flipped");
        card2.classList.remove("flipped");

        card1.classList.add("matched");
        card2.classList.add("matched");

        matches++;

        document.getElementById("matches").textContent =
            `${matches} / 8`;

        flippedCards = [];

        lockBoard = false;


        if (matches === 8) {

            clearInterval(timer);

            document.getElementById("winMessage").style.display = "block";

            document.getElementById("winStats").textContent =
                `You completed the game in ${moves} moves and ${document.getElementById("timer").textContent}! 🏆`;

        }

    }

    else {

        setTimeout(() => {

            card1.classList.remove("flipped");
            card2.classList.remove("flipped");

            flippedCards = [];

            lockBoard = false;

        }, 800);

    }

}


startGame();

</script>

</body>
</html>
